name: modpack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip three mods (official archive format: content at zip root + descriptor.mod with archive=)
        shell: bash
        run: |
          set -e
          declare -A NAME=(
            [ck2_chinese_tw]="CK2 Traditional Chinese Localization 3.x (zh-TW)"
            [ck2_chinese_sup]="CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW)"
            [chinese_gui_fix_3]="CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW)"
          )
          declare -A TAGS=(
            [ck2_chinese_tw]="Language Localisation"
            [ck2_chinese_sup]="Translation"
            [chinese_gui_fix_3]="Translation"
          )
          for src in ck2_chinese ck2_chinese_sup chinese_gui_fix_3; do
            out="${src}"; [ "$src" = "ck2_chinese" ] && out="ck2_chinese_tw"
            (
              cd "$src"
              find . -path ./.git -prune -o -type f \
                ! -name '*.mod' ! -name 'descriptor.mod' ! -name '*.bak' -print0 \
                | while IFS= read -r -d '' f; do echo "$f"; done \
                | zip -@ "../${out}.zip"
              printf 'name="%s"\narchive="mod/%s.zip"\ntags={\n\t%s\n}\npicture="thumb.jpg"\n' \
                "${NAME[$out]}" "$out" "${TAGS[$out]}" > descriptor.mod
              zip -g "../${out}.zip" descriptor.mod
              rm descriptor.mod
            )
          done
          ls -la *.zip