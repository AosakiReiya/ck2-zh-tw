name: modpack

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (main = TW edition; full refs for basic-zh)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch all branches + LFS setup
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' --no-tags
          git lfs install --local

      - name: Materialize basic-zh worktree with real LFS files
        run: |
          git worktree add ../wt-basic origin/basic-zh
          git -C ../wt-basic lfs pull

      - name: Build 6 mod packs (TW x3 from main tree, Basic x3 from wt-basic)
        run: |
          set -e
          mkdir -p artifacts
          ABS="$(cd artifacts && pwd)"

          pack() { # $1=src-dir  $2=out-zip  $3=display-name
            local src="$1" out="$2" name="$3" abs
            abs="$(cd "$src" && pwd)"
            (
              cd "$abs"
              find . -type f ! -name '*.mod' ! -name 'descriptor.mod' ! -name '*.bak' \
                ! -path '*/.fonts_bak/*' ! -path '*/__pycache__/*' -print0 \
                | while IFS= read -r -d '' f; do echo "$f"; done \
                | zip -q -X "$ABS/${out}.zip" -@
            )
            printf 'name="%s"\n' "$name" > /dev/null
            # sanity: every shipped font must be a real DDS (>10KB, "DDS " magic), never an LFS pointer
            local check
            for check in gfx/fonts/zh-hans-16.dds gfx/fonts/zh-hans-map.dds gfx/fonts/zh-hans-16.fnt; do
              if unzip -p "artifacts/${out}.zip" "$check" 2>/dev/null | head -c 4 | grep -q "version"; then
                echo "::error::${out}.zip contains LFS pointer at $check"; exit 1
              fi
            done
            unzip -l "artifacts/${out}.zip" >/dev/null
          }
          write_mod() { # $1=zip-basename  $2=display-name  $3=tags
            printf 'name="%s"\narchive="mod/%s.zip"\ntags={\n\t%s\n}\npicture="thumb.jpg"\n' "$2" "$1" "$3" > "artifacts/$1.mod"
          }

          # --- Edition 1: Traditional + Taiwan localization + LLM polish (main tree) ---
          pack ck2_chinese          ck2_chinese_tw        "CK2 Traditional Chinese Localization 3.x (zh-TW)"
          pack ck2_chinese_sup      ck2_chinese_sup       "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW)"
          pack chinese_gui_fix_3    chinese_gui_fix_3     "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW)"
          write_mod ck2_chinese_tw      "CK2 Traditional Chinese Localization 3.x (zh-TW)"        "Language Localisation"
          write_mod ck2_chinese_sup     "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW)" "Translation"
          write_mod chinese_gui_fix_3   "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW)"      "Translation"

          # --- Edition 2: Traditional + basic lexis, no LLM (basic-zh worktree) ---
          pack ../wt-basic/ck2_chinese       ck2_chinese_basic        "CK2 Traditional Chinese Localization 3.x (zh-TW Basic)"
          pack ../wt-basic/ck2_chinese_sup   ck2_chinese_sup_basic    "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW Basic)"
          pack ../wt-basic/chinese_gui_fix_3 chinese_gui_fix_3_basic  "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW Basic)"
          write_mod ck2_chinese_basic        "CK2 Traditional Chinese Localization 3.x (zh-TW Basic)"    "Language Localisation"
          write_mod ck2_chinese_sup_basic    "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW Basic)" "Translation"
          write_mod chinese_gui_fix_3_basic  "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW Basic)" "Translation"

          ls -la artifacts/
          du -sh artifacts/*

      - name: Publish GitHub Release (6 zips + 6 mods)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
