name: modpack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Zip three mods
        shell: bash
        run: |
          set -e
          cd ck2_chinese && zip -r ../ck2_chinese_tw.zip . && cd ..
          cd ck2_chinese_sup && zip -r ../ck2_chinese_sup.zip . && cd ..
          cd chinese_gui_fix_3 && zip -r ../chinese_gui_fix_3.zip . && cd ..
          ls -la *.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mods
          path: |
            ck2_chinese_tw.zip
            ck2_chinese_sup.zip
            chinese_gui_fix_3.zip
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mods-${{ github.run_number }}
          name: CK2 繁體漢化包 - build ${{ github.run_number }}
          body: |
            - ck2_chinese_tw.zip   主體漢化(含顯示用字型)
            - ck2_chinese_sup.zip  補充漢化(文化/事件/人物)
            - chinese_gui_fix_3.zip UI 修正

            手動安裝:三個 zip 放進
            `Documents\Paradox Interactive\Crusader Kings II\mod\`,
            同目錄放置對應的 .mod 描述檔(archive="mod/xxx.zip")後於啟動器啟用。
          files: |
            ck2_chinese_tw.zip
            ck2_chinese_sup.zip
            chinese_gui_fix_3.zip
          fail_on_unmatched_files: true