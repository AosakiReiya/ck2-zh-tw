name: modpack

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for git archive)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build both editions (official archive format: zip root = content + descriptor.mod with archive=)
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          make_zip() { # $1=src-dir  $2=zip-name  $3=display-name  $4=tags
            local src="$1" out="$2" name="$3" tags="$4"
            (
              cd "$src"
              find . -type f ! -name '*.mod' ! -name 'descriptor.mod' ! -name '*.bak' \
                ! -path '*/.fonts_bak/*' ! -path '*/__pycache__/*' -print0 \
                | while IFS= read -r -d '' f; do echo "$f"; done \
                | zip -@ "../${out}.zip"
              printf 'name="%s"\narchive="mod/%s.zip"\ntags={\n\t%s\n}\npicture="thumb.jpg"\n' \
                "$name" "$out" "$tags" > descriptor.mod
              zip -g "../${out}.zip" descriptor.mod
              rm descriptor.mod
            )
            mv "${out}.zip" artifacts/
          }

          make_zip_git() { # $1=gitref  $2=src-dir  $3=zip-name  $4=display-name  $5=tags
            local ref="$1" d="$2" out="$3" name="$4" tags="$5"
            rm -rf /tmp/src && mkdir -p /tmp/src
            git archive "$ref" "$d" | tar -x -C /tmp/src
            make_zip "/tmp/src/$d" "$out" "$name" "$tags"
          }

          # 版本一:台灣化完整版(079f472 可玩內容 = 現 HEAD 工作區)
          make_zip ck2_chinese ck2_chinese_tw "CK2 Traditional Chinese Localization 3.x (zh-TW)" "Language Localisation"
          make_zip ck2_chinese_sup ck2_chinese_sup "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW)" "Translation"
          make_zip chinese_gui_fix_3 chinese_gui_fix_3 "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW)" "Translation"
          # 版本二:基本繁體版(21a34ee,LLM 前,含修改字型 + T1 詞表)
          make_zip_git 21a34ee ck2_chinese ck2_chinese_basic "CK2 Traditional Chinese Localization 3.x (zh-TW Basic)" "Language Localisation"
          make_zip_git 21a34ee ck2_chinese_sup ck2_chinese_sup_basic "CK2 Traditional Chinese Supplemental Localization 3.x (zh-TW Basic)" "Translation"
          make_zip_git 21a34ee chinese_gui_fix_3 chinese_gui_fix_3_basic "CK2 Traditional Chinese Interface Fix 3.3.X (zh-TW Basic)" "Translation"
          ls -la artifacts/

      - name: Attach to GitHub Release (tag like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true

      - name: Upload artifacts (main branch / manual)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: ck2-zh-tw-mods
          path: artifacts/*.zip